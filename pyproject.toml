[project]
name = "medvision-roco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aalavikhan", email = "aalavimkhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.11.2",
    "numpy<2",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "qwen-vl-utils>=0.0.14",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "tqdm>=4.70.1",
    "transformers>=4.48",
]

[project.scripts]
medvision-roco = "medvision_roco:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"